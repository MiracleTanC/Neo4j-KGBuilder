# ========== 发布配置（遗留保留） ==========
# 说明：日常开发用 dev（内置 H2），生产持久化推荐 mysql；
# 本文件为历史遗留的发布档位，已将 Neo4j 前缀从 custom.neo4j.* 对齐为 neo4j.*
server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 100000000
      maxRequestSize: 200000000
  thymeleaf:
    cache : false
    mode: HTML5
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kg?useSSL=false&serverTimezone=UTC}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    type: com.zaxxer.hikari.HikariDataSource
neo4j:
  url: ${NEO4J_URL:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  # 密码请通过环境变量 NEO4J_PASSWORD 注入，切勿提交真实密码
  password: ${NEO4J_PASSWORD:123456}
  file:
    serverurl:  http://localhost:8089
    location : D:\\kgmanager\\csv\\   #如果是Windows情况下，格式是 D:\\kgmanager\\csv\\   linux 格式"/home/kgmanager/csv/";
mybatis:
  typeAliasesPackage: com.warmer.kgmaker.entity
  mapperLocations: classpath*:/mapping/*.xml
#配置分页插件pagehelper
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
