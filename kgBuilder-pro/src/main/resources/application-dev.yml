server:
  port: 8081
spring:
  servlet:
    multipart:
      max-file-size: 100000000
      maxRequestSize: 200000000
  neo4j:
      url: ${NEO4J_URL:bolt://localhost:7687}
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:123456}
  datasource:
      url: ${DB_URL:jdbc:h2:mem:kg;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
      driverClassName: ${DB_DRIVER:org.h2.Driver}
      username: ${DB_USERNAME:sa}
      password: ${DB_PASSWORD:}
      type: com.zaxxer.hikari.HikariDataSource
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
mybatis:
  typeAliasesPackage: com.warmer.kgmaker.entity
  mapperLocations: classpath*:/mapping/*.xml
file:
  serverurl:  http://localhost:8081
  location : D:\\kgmanager\\csv\\   #如果是Windows情况下，格式是 D:\\kgmanager\\csv\\   linx 格式"/home/kgmanager/csv/";
