# ========== 开发默认配置：内置 H2 内存库（MySQL 兼容模式），开箱即用 ==========
# 数据保存在内存中，重启即清空；需要持久化请切换到 mysql profile（见 application-mysql.yml）
spring:
  datasource:
    url: jdbc:h2:mem:kgbuilder;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password:
    type: com.zaxxer.hikari.HikariDataSource
  sql:
    init:
      # 启动时按 schema.sql 初始化表结构
      mode: always
      schema-locations: classpath:schema.sql
